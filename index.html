<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DisegnaLo!</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --card: #1a1928;
    --accent: #ff6b35;
    --yellow: #ffd166;
    --green: #06d6a0;
    --blue: #118ab2;
    --purple: #9b5de5;
    --red: #ef233c;
    --text: #fffffe;
    --muted: #a7a9be;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,107,53,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(155,93,229,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container { position:relative; z-index:1; width:100%; max-width:680px; }

  /* HEADER */
  .header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }

  h1 {
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(2.8rem,9vw,4.5rem); letter-spacing:4px;
    background:linear-gradient(135deg,var(--accent),var(--yellow));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    flex:1; text-align:center;
  }

  .manche-badge { background:var(--card); border:2px solid rgba(255,255,255,.12); border-radius:12px; padding:8px 14px; text-align:center; min-width:80px; }
  .manche-label { font-size:.55rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--muted); display:block; }
  .manche-num   { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; line-height:1; color:var(--yellow); }

  .subtitle { text-align:center; color:var(--muted); font-size:.85rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; }

  /* TURN BANNER */
  .turn-banner {
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:13px 20px; border-radius:14px; margin-bottom:20px;
    font-family:'Bebas Neue',sans-serif; font-size:1.25rem; letter-spacing:2px;
    transition:background .4s,border-color .4s,color .4s,box-shadow .4s; border:2px solid;
  }
  .turn-banner.team1 { background:rgba(6,214,160,.1); border-color:var(--green); color:var(--green); box-shadow:0 0 20px rgba(6,214,160,.15); }
  .turn-banner.team2 { background:rgba(17,138,178,.1); border-color:var(--blue);  color:var(--blue);  box-shadow:0 0 20px rgba(17,138,178,.15); }

  .turn-dot { width:10px; height:10px; border-radius:50%; animation:blink 1.2s ease-in-out infinite; }
  .team1 .turn-dot { background:var(--green); }
  .team2 .turn-dot { background:var(--blue); }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.3;} }

  /* CARDS AREA */
  .cards-area { margin-bottom:20px; }

  .btn-genera-wrap {
    display:flex; align-items:center; justify-content:center;
    min-height:220px; border-radius:20px;
    background:linear-gradient(135deg,rgba(255,107,53,.12),rgba(155,93,229,.12));
    border:2px dashed rgba(255,107,53,.4);
  }
  .btn-genera-wrap.hidden { display:none; }

  .btn-genera {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    width:100%; min-height:220px; padding:30px;
    font-family:'Bebas Neue',sans-serif; font-size:clamp(1.6rem,5vw,2.2rem); letter-spacing:3px;
    border:none; border-radius:18px; cursor:pointer;
    background:transparent; color:var(--accent);
    transition:color .2s,transform .15s;
  }
  .btn-genera:hover { color:var(--yellow); transform:scale(1.03); }
  .btn-genera .genera-icon { font-size:3.5rem; animation:floatIcon 2.5s ease-in-out infinite; }
  @keyframes floatIcon { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

  .cards-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cards-grid.hidden { display:none; }

  .word-card {
    background:var(--card); border-radius:16px; padding:18px 16px;
    position:relative; overflow:hidden; animation:cardIn .4s both;
  }
  .word-card:nth-child(1){animation-delay:.05s;--cat-color:var(--blue);}
  .word-card:nth-child(2){animation-delay:.10s;--cat-color:var(--green);}
  .word-card:nth-child(3){animation-delay:.15s;--cat-color:var(--yellow);}
  .word-card:nth-child(4){animation-delay:.20s;--cat-color:var(--accent);}
  .word-card.proverb{--cat-color:var(--purple);}

  .word-card::before { content:''; position:absolute; top:0;left:0;right:0; height:3px; background:var(--cat-color); }

  @keyframes cardIn { from{opacity:0;transform:translateY(18px) scale(.97);} to{opacity:1;transform:translateY(0) scale(1);} }

  .cat-label { font-size:.62rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--cat-color); margin-bottom:7px; display:flex; align-items:center; gap:5px; }
  .word-text { font-size:clamp(.95rem,2.8vw,1.35rem); font-weight:900; line-height:1.25; color:var(--text); padding-right:38px; }
  .points-badge { position:absolute; top:12px;right:12px; background:var(--cat-color); color:var(--bg); font-size:.68rem; font-weight:900; padding:3px 8px; border-radius:20px; letter-spacing:1px; }

  /* TIMER */
  .timer-wrap { display:flex; flex-direction:column; align-items:center; margin-bottom:18px; }
  .timer-ring { position:relative; width:130px; height:130px; }
  .timer-ring svg { transform:rotate(-90deg); width:130px; height:130px; }
  .timer-ring circle { fill:none; stroke-width:6; }
  .ring-bg { stroke:rgba(255,255,255,.08); }
  .ring-progress { stroke:var(--accent); stroke-linecap:round; stroke-dasharray:351.86; stroke-dashoffset:0; transition:stroke-dashoffset 1s linear,stroke .3s; }
  .timer-number { position:absolute;inset:0; display:flex;align-items:center;justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:2.6rem;letter-spacing:2px; transition:color .3s; }
  .timer-number.warning{color:var(--yellow);}
  .timer-number.danger{color:var(--red);}

  /* MAIN ACTION ROW */
  .main-btn-row { display:flex; gap:12px; }

  .btn-start {
    flex:2; padding:17px;
    font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:3px;
    border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#ff9a3c);
    color:white; transition:transform .15s,box-shadow .15s;
    box-shadow:0 4px 24px rgba(255,107,53,.35);
    position:relative; overflow:hidden;
  }
  .btn-start::after { content:''; position:absolute;inset:0; background:linear-gradient(135deg,rgba(255,255,255,.12),transparent); border-radius:14px; }
  .btn-start:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 32px rgba(255,107,53,.45); }
  .btn-start:disabled { opacity:.4; cursor:not-allowed; }

  .btn-rigenera {
    flex:1; padding:17px;
    font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:2px;
    border:2px solid rgba(255,255,255,.2); border-radius:14px; cursor:pointer;
    background:transparent; color:var(--text);
    transition:all .15s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .btn-rigenera .rigenera-icon { font-size:1.2rem; }
  .btn-rigenera:hover:not(:disabled) { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.35); }
  .btn-rigenera:disabled { opacity:.35; cursor:not-allowed; }

  .btn-row { display:flex; gap:10px; margin-top:10px; }

  .btn-secondary {
    flex:1; padding:13px 6px;
    font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:1.5px;
    border:2px solid rgba(255,255,255,.15); border-radius:14px;
    cursor:pointer; background:transparent; color:var(--text); transition:all .15s;
  }
  .btn-secondary:hover:not(:disabled) { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.3); }
  .btn-secondary:disabled { opacity:.35; cursor:not-allowed; }

  .btn-pause { border-color:var(--yellow); color:var(--yellow); }
  .btn-pause:hover:not(:disabled) { background:rgba(255,209,102,.1) !important; }
  .btn-pause.paused { background:rgba(255,209,102,.12); }

  .btn-fine { border-color:var(--red); color:var(--red); }
  .btn-fine:hover:not(:disabled) { background:rgba(239,35,60,.1) !important; }

  /* SCORES */
  .scores-section { margin-top:20px; background:var(--card); border-radius:16px; padding:18px; }
  .scores-title { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:2px; color:var(--muted); margin-bottom:12px; text-align:center; }
  .teams-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .team-card { background:rgba(255,255,255,.04); border-radius:12px; padding:14px; text-align:center; border:2px solid rgba(255,255,255,.06); transition:border-color .3s,background .3s; }
  .team-card.active-playing { border-color:rgba(255,255,255,.25); background:rgba(255,255,255,.06); }
  .team-name { font-size:.7rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .team-score { font-family:'Bebas Neue',sans-serif; font-size:2.8rem; line-height:1; }
  .team-score.s1{color:var(--green);}
  .team-score.s2{color:var(--blue);}
  .score-btns { display:flex; gap:6px; margin-top:8px; justify-content:center; }
  .score-btn { width:30px;height:30px; border-radius:50%; border:2px solid rgba(255,255,255,.2); background:transparent; color:var(--text); font-size:1.1rem; cursor:pointer; display:flex;align-items:center;justify-content:center; font-weight:900; transition:all .15s; }
  .score-btn:hover { background:rgba(255,255,255,.1); }

  /* SCORING OVERLAY */
  .overlay { display:none; position:fixed;inset:0; background:rgba(0,0,0,.92); z-index:100; align-items:center;justify-content:center; flex-direction:column; padding:24px; overflow-y:auto; }
  .overlay.show { display:flex; animation:fadeIn .3s both; }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .overlay-box { background:var(--card); border-radius:20px; padding:28px 24px; width:100%; max-width:500px; border:2px solid rgba(255,255,255,.08); }
  .overlay-title { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:3px; color:var(--red); text-align:center; margin-bottom:6px; }
  .overlay-team-label { text-align:center; font-size:.75rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:20px; }

  .check-list { display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .check-row { display:flex;align-items:center;gap:12px; background:rgba(255,255,255,.04); border-radius:12px; padding:12px 14px; cursor:pointer; border:2px solid rgba(255,255,255,.07); transition:border-color .2s,background .2s; user-select:none; }
  .check-row.checked { border-color:var(--row-color); background:rgba(var(--row-rgb),.1); }
  .check-icon { width:28px;height:28px; border-radius:50%; border:2px solid rgba(255,255,255,.25); display:flex;align-items:center;justify-content:center; font-size:1rem;flex-shrink:0; transition:background .2s,border-color .2s; color:transparent; }
  .check-row.checked .check-icon { background:var(--row-color); border-color:var(--row-color); color:var(--bg); }
  .check-info { flex:1; }
  .check-cat { font-size:.58rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--row-color);margin-bottom:2px; }
  .check-word { font-size:1rem;font-weight:900;color:var(--text); }
  .check-pts { font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;color:var(--row-color);opacity:.7;transition:opacity .2s; }
  .check-row.checked .check-pts { opacity:1; }

  .total-bar { display:flex;align-items:center;justify-content:space-between; background:rgba(255,255,255,.06); border-radius:12px;padding:14px 18px;margin-bottom:18px; }
  .total-label { font-size:.7rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted); }
  .total-pts { font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--yellow);letter-spacing:2px; }

  .overlay-confirm { width:100%;padding:16px; font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px; border:none;border-radius:14px;cursor:pointer; background:linear-gradient(135deg,var(--accent),#ff9a3c); color:white;box-shadow:0 4px 24px rgba(255,107,53,.4); transition:transform .15s; }
  .overlay-confirm:hover { transform:scale(1.02); }

  @keyframes pulse-ring { 0%,100%{filter:drop-shadow(0 0 4px var(--accent));}  50%{filter:drop-shadow(0 0 14px var(--accent));} }
  .ring-active { animation:pulse-ring 2s ease-in-out infinite; }

  /* TOAST */
  .toast { position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px); background:var(--card);border:2px solid rgba(255,255,255,.15); border-radius:14px;padding:14px 28px; font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px; color:var(--text);z-index:200; transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .4s; opacity:0;white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header-row">
    <div style="width:80px"></div>
    <h1>DisegnaLo!</h1>
    <div class="manche-badge">
      <span class="manche-label">Manche</span>
      <span class="manche-num" id="mancheNum">1</span>
    </div>
  </div>
  <p class="subtitle">Gioco a squadre • Disegna &amp; Indovina</p>

  <!-- TURN BANNER -->
  <div class="turn-banner team1" id="turnBanner">
    <div class="turn-dot"></div>
    <span id="turnLabel">Turno — Squadra 1</span>
  </div>

  <!-- CARDS AREA -->
  <div class="cards-area">
    <!-- GENERA button -->
    <div class="btn-genera-wrap" id="generaWrap">
      <button class="btn-genera" onclick="generateAndShow()">
        <span class="genera-icon">🎲</span>
        GENERA PAROLE
      </button>
    </div>

    <!-- CARDS -->
    <div class="cards-grid hidden" id="cardsGrid">
      <div class="word-card" id="card0"><div class="cat-label" id="catLabel0"></div><div class="word-text" id="word0"></div><span class="points-badge" id="pts0"></span></div>
      <div class="word-card" id="card1"><div class="cat-label" id="catLabel1"></div><div class="word-text" id="word1"></div><span class="points-badge" id="pts1"></span></div>
      <div class="word-card" id="card2"><div class="cat-label" id="catLabel2"></div><div class="word-text" id="word2"></div><span class="points-badge" id="pts2"></span></div>
      <div class="word-card" id="card3"><div class="cat-label" id="catLabel3"></div><div class="word-text" id="word3"></div><span class="points-badge" id="pts3"></span></div>
    </div>
  </div>

  <!-- TIMER -->
  <div class="timer-wrap">
    <div class="timer-ring" id="timerRing">
      <svg viewBox="0 0 130 130">
        <circle class="ring-bg" cx="65" cy="65" r="56"/>
        <circle class="ring-progress" id="ringProgress" cx="65" cy="65" r="56"/>
      </svg>
      <div class="timer-number" id="timerDisplay">2:00</div>
    </div>
  </div>

  <!-- MAIN ACTION ROW: INIZIO + RIGENERA -->
  <div class="main-btn-row">
    <button class="btn-start" id="btnStart" onclick="startTimer()">▶ INIZIO</button>
    <button class="btn-rigenera" id="btnRigenera" onclick="regenWords()" disabled>
      <span class="rigenera-icon">🔀</span>
      RIGENERA
    </button>
  </div>

  <!-- SECONDARY ROW: PAUSA + FINE -->
  <div class="btn-row">
    <button class="btn-secondary btn-pause" id="btnPause" onclick="togglePause()" disabled>⏸ PAUSA</button>
    <button class="btn-secondary btn-fine"  id="btnFine"  onclick="endTurn()"    disabled>⏹ FINE</button>
  </div>

  <!-- SCORES -->
  <div class="scores-section">
    <div class="scores-title">PUNTEGGIO</div>
    <div class="teams-row">
      <div class="team-card active-playing" id="scoreCard1">
        <div class="team-name">Squadra 1</div>
        <div class="team-score s1" id="score1">0</div>
        <div class="score-btns">
          <button class="score-btn" onclick="changeScore(1,-1)">−</button>
          <button class="score-btn" onclick="changeScore(1,+1)">+</button>
        </div>
      </div>
      <div class="team-card" id="scoreCard2">
        <div class="team-name">Squadra 2</div>
        <div class="team-score s2" id="score2">0</div>
        <div class="score-btns">
          <button class="score-btn" onclick="changeScore(2,-1)">−</button>
          <button class="score-btn" onclick="changeScore(2,+1)">+</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SCORING OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="overlay-title" id="overlayTitle">⏰ TEMPO SCADUTO!</div>
    <div class="overlay-team-label" id="overlayTeamLabel">Squadra 1 — Seleziona le parole indovinate</div>
    <div class="check-list" id="checkList"></div>
    <div class="total-bar">
      <span class="total-label">Punti guadagnati</span>
      <span class="total-pts" id="totalPts">0</span>
    </div>
    <button class="overlay-confirm" onclick="confirmScore()">✔ CONFERMA E CONTINUA</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── WORD LISTS ───────────────────────────────────────────────
const WORDS = {
  luoghi:   ["Foresta","Grotta","Castello","Spiaggia","Deserto","Vulcano","Mercato","Stadio","Faro","Biblioteca","Aeroporto","Circo","Labirinto","Porto","Monastero","Isola","Campanile","Oasi","Cattedrale","Prigione","Ospedale","Scuderia","Cimitero","Piscina","Pizzeria","Farmacia","Palestra","Discoteca","Banca","Museo"],
  cose:     ["Ombrello","Chiave","Ancora","Lanterna","Trapano","Mappamondo","Bussola","Sofà","Tromba","Baule","Forbici","Altalena","Flauto","Bilancia","Tamburo","Brocca","Specchio","Torcia","Clessidra","Carrucola","Martello","Bottone","Candela","Pettine","Spazzolino","Forchetta","Cucchiaio","Pentola","Cuscino","Fischietto"],
  animali:  ["Cane","Gatto","Elefante","Leone","Tigre","Giraffa","Scimmia","Pinguino","Coccodrillo","Serpente","Aquila","Delfino","Cavallo","Mucca","Maiale","Gallina","Coniglio","Volpe","Lupo","Orso","Zebra","Rinoceronte","Ippopotamo","Cammello","Pecora","Capra","Asino","Toro","Pappagallo","Gufo"],
  azioni:   ["Arrampicarsi","Fischiare","Sbadigliare","Inciampare","Galleggiare","Tuffarsi","Tamburellare","Sbirciare","Barcollare","Accarezzare","Spingere","Rimbalzare","Solleticare","Dondolare","Rotolare","Afferrare","Saltellare","Correre","Nuotare","Volare","Dormire","Mangiare","Piangere","Ridere","Urlare","Ballare","Cantare","Scavare","Abbracciare","Sculacciare"],
  proverbi: ["Il lupo perde il pelo ma non il vizio","Chi dorme non piglia pesci","Gallina vecchia fa buon brodo","Non tutte le ciambelle riescono col buco","Meglio un uovo oggi che una gallina domani","L'abito non fa il monaco","Chi va piano va sano e va lontano","A caval donato non si guarda in bocca","Il mattino ha l'oro in bocca","Tra il dire e il fare c'è di mezzo il mare"]
};

const CAT_CONFIG = [
  { key:"luoghi",  label:"Luoghi",  icon:"🏛️", pts:5, color:"var(--blue)",   rgb:"17,138,178"  },
  { key:"cose",    label:"Cose",    icon:"📦", pts:3, color:"var(--green)",  rgb:"6,214,160"   },
  { key:"animali", label:"Animali", icon:"🐾", pts:4, color:"var(--yellow)", rgb:"255,209,102" },
  { key:"azioni",  label:"Azioni",  icon:"🏃", pts:6, color:"var(--accent)", rgb:"255,107,53"  },
];
const PROV = { key:"proverbi", label:"Proverbio", icon:"📜", pts:8, color:"var(--purple)", rgb:"155,93,229" };

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

let currentCards   = [];
let wordsGenerated = false;

function generateAndShow(){
  drawWords();
  document.getElementById('generaWrap').classList.add('hidden');
  document.getElementById('cardsGrid').classList.remove('hidden');
  wordsGenerated = true;
  document.getElementById('btnRigenera').disabled = false;
}

function regenWords(){
  // only if timer is not running
  drawWords();
}

function drawWords(){
  const useProverb = Math.random() < 0.20;
  const provSlot   = useProverb ? Math.floor(Math.random()*4) : -1;
  currentCards = [];

  for(let i = 0; i < 4; i++){
    const card = document.getElementById('card'+i);
    card.classList.remove('proverb');
    const cfg  = (i === provSlot) ? PROV : CAT_CONFIG[i];
    const word = pick(WORDS[cfg.key]);
    if(i === provSlot) card.classList.add('proverb');
    card.style.setProperty('--cat-color', cfg.color);
    document.getElementById('catLabel'+i).innerHTML = `<span>${cfg.icon}</span> ${cfg.label}`;
    document.getElementById('pts'+i).textContent    = cfg.pts + ' pt';
    document.getElementById('word'+i).textContent   = word;
    currentCards.push({ word, cfg, pts: cfg.pts });
  }
}

// ── TEAM / MANCHE ────────────────────────────────────────────
let activeTeam  = 1;
let mancheCount = 1;
let turnsPlayed = 0;

function updateTurnBanner(){
  const banner = document.getElementById('turnBanner');
  banner.className = 'turn-banner ' + (activeTeam===1 ? 'team1' : 'team2');
  document.getElementById('turnLabel').textContent = `Turno — Squadra ${activeTeam}`;
  document.getElementById('scoreCard1').classList.toggle('active-playing', activeTeam===1);
  document.getElementById('scoreCard2').classList.toggle('active-playing', activeTeam===2);
}

function switchTeam(){
  activeTeam = activeTeam===1 ? 2 : 1;
  turnsPlayed++;
  if(turnsPlayed >= 2){
    mancheCount++;
    turnsPlayed = 0;
    document.getElementById('mancheNum').textContent = mancheCount;
  }
  updateTurnBanner();

  // reset cards area for next turn
  document.getElementById('cardsGrid').classList.add('hidden');
  document.getElementById('generaWrap').classList.remove('hidden');
  wordsGenerated = false;
  document.getElementById('btnRigenera').disabled = true;

  showToast(`Ora tocca alla Squadra ${activeTeam}!`);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── TIMER ────────────────────────────────────────────────────
const TOTAL = 120;
const CIRC  = 2 * Math.PI * 56;
let remaining = TOTAL;
let interval  = null;
let paused    = false;

function updateDisplay(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const el = document.getElementById('timerDisplay');
  el.textContent = m+':'+(s<10?'0':'')+s;
  el.className = 'timer-number'+(remaining<=10?' danger':remaining<=30?' warning':'');
  const ring = document.getElementById('ringProgress');
  ring.style.strokeDashoffset = CIRC*(1-remaining/TOTAL);
  ring.style.stroke = remaining<=10?'var(--red)':remaining<=30?'var(--yellow)':'var(--accent)';
}

function startTimer(){
  if(interval) return;
  // if words not yet generated, generate them first
  if(!wordsGenerated) generateAndShow();
  remaining = TOTAL; paused = false;
  updateDisplay(); setBtns(true);
  document.getElementById('btnPause').textContent = '⏸ PAUSA';
  document.getElementById('btnPause').classList.remove('paused');
  document.getElementById('timerRing').classList.add('ring-active');
  interval = setInterval(tick, 1000);
}

function tick(){
  remaining--;
  updateDisplay();
  if(remaining <= 0){
    clearInterval(interval); interval = null;
    setBtns(false);
    playAlarm();
    openScoringOverlay('⏰ TEMPO SCADUTO!');
  }
}

function togglePause(){
  if(!interval && !paused) return;
  if(paused){
    paused = false;
    interval = setInterval(tick, 1000);
    document.getElementById('btnPause').textContent = '⏸ PAUSA';
    document.getElementById('btnPause').classList.remove('paused');
    document.getElementById('timerRing').classList.add('ring-active');
  } else {
    clearInterval(interval); interval = null; paused = true;
    document.getElementById('btnPause').textContent = '▶ RIPRENDI';
    document.getElementById('btnPause').classList.add('paused');
    document.getElementById('timerRing').classList.remove('ring-active');
  }
}

function endTurn(){
  clearInterval(interval); interval = null; paused = false;
  setBtns(false);
  document.getElementById('btnPause').textContent = '⏸ PAUSA';
  document.getElementById('btnPause').classList.remove('paused');
  openScoringOverlay('🏁 FINE TURNO');
}

function setBtns(running){
  document.getElementById('btnStart').disabled    = running;
  document.getElementById('btnRigenera').disabled = running || !wordsGenerated;
  document.getElementById('btnPause').disabled    = !running;
  document.getElementById('btnFine').disabled     = !running;
  if(!running) document.getElementById('timerRing').classList.remove('ring-active');
}

// ── SCORING OVERLAY ──────────────────────────────────────────
function openScoringOverlay(title){
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlayTeamLabel').textContent = `Squadra ${activeTeam} — Seleziona le parole indovinate`;

  const list = document.getElementById('checkList');
  list.innerHTML = '';
  document.getElementById('totalPts').textContent = '0';

  currentCards.forEach(c => {
    const row = document.createElement('div');
    row.className = 'check-row';
    row.style.setProperty('--row-color', c.cfg.color);
    row.style.setProperty('--row-rgb',   c.cfg.rgb);
    row.dataset.pts = c.pts;
    row.innerHTML = `
      <div class="check-icon">✓</div>
      <div class="check-info">
        <div class="check-cat">${c.cfg.icon} ${c.cfg.label}</div>
        <div class="check-word">${c.word}</div>
      </div>
      <div class="check-pts">+${c.pts}</div>
    `;
    row.addEventListener('click', () => {
      row.classList.toggle('checked');
      recalcTotal();
    });
    list.appendChild(row);
  });

  document.getElementById('overlay').classList.add('show');
}

function recalcTotal(){
  let tot = 0;
  document.querySelectorAll('.check-row.checked').forEach(r => tot += parseInt(r.dataset.pts));
  document.getElementById('totalPts').textContent = tot;
}

function confirmScore(){
  let tot = 0;
  document.querySelectorAll('.check-row.checked').forEach(r => tot += parseInt(r.dataset.pts));
  scores[activeTeam-1] += tot;
  document.getElementById('score'+activeTeam).textContent = scores[activeTeam-1];
  document.getElementById('overlay').classList.remove('show');
  remaining = TOTAL;
  updateDisplay();
  switchTeam();
}

// ── SOUND ─────────────────────────────────────────────────────
function playAlarm(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.38,.76,1.14,1.52].forEach(t=>{
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.value=880; osc.type='square';
      g.gain.setValueAtTime(.28,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.28);
      osc.start(ctx.currentTime+t); osc.stop(ctx.currentTime+t+.32);
    });
  }catch(e){}
}

// ── SCORES ────────────────────────────────────────────────────
const scores = [0,0];
function changeScore(team, delta){
  scores[team-1] = Math.max(0, scores[team-1]+delta);
  document.getElementById('score'+team).textContent = scores[team-1];
}

// ── INIT ──────────────────────────────────────────────────────
updateDisplay();
updateTurnBanner();
</script>
</body>
</html>
